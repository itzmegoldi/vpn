[project]
name = "vpn"
version = "0.1.0"
description = ""
authors = [
    {name = "Prashant Yadav",email = "officialprashant110@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "annotated-doc (==0.0.4)",
    "annotated-types (==0.7.0)",
    "anyio (==4.14.0)",
    "asyncpg (==0.31.0)",
    "bcrypt (==5.0.0)",
    "cffi (==2.0.0)",
    "click (==8.4.1)",
    "cryptography (==49.0.0)",
    "fastapi (==0.138.0)",
    "greenlet (==3.5.2)",
    "h11 (==0.16.0)",
    "idna (==3.18)",
    "invoke (==3.0.3)",
    "paramiko (==5.0.0)",
    "psycopg2-binary (==2.9.12)",
    "pycparser (==3.0)",
    "pydantic (==2.13.4)",
    "pydantic-settings (==2.14.2)",
    "pydantic-core (==2.46.4)",
    "pynacl (==1.6.2)",
    "python-dotenv (==1.2.2)",
    "redis (==8.0.0)",
    "sqlalchemy (==2.0.51)",
    "starlette (==1.3.1)",
    "structlog (==26.1.0)",
    "typing-inspection (==0.4.2)",
    "typing-extensions (==4.15.0)",
    "uvicorn (==0.49.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
